[project]
name = "log-analyser"
version = "0.1.0"
description = "Local SSH authentication log pipeline and security dashboard"
readme = "README.md"
authors = [
    { name = "adamlti", email = "adamloutaoui@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "psycopg2-binary>=2.9.13",
    "requests>=2.34.2",
]

[project.scripts]
log-analyser = "log_analyser:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
